name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npx @vscode/vsce@latest package

      - name: List files
        run: ls -la && ls -la *.vsix || true

      - name: Check Marketplace connectivity (best-effort)
        run: |
          echo "testing endpoint..."
          curl -I -sS --max-time 20 https://marketplace.visualstudio.com/_apis/gallery || true

      - name: Publish to VS Code Marketplace (retry + backoff)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          npm_config_loglevel: verbose
        run: |
          set -euo pipefail

          VSIX_PATH="$(ls -1 *.vsix | head -n 1)"
          echo "Using VSIX: $VSIX_PATH"

          attempts=8
          for i in $(seq 1 $attempts); do
            echo "Publish attempt $i/$attempts..."
            if npx @vscode/vsce@latest publish -p "$VSCE_PAT" --packagePath "$VSIX_PATH"; then
              echo "publish succeeded on attempt $i"
              exit 0
            fi

            if [ "$i" -lt "$attempts" ]; then
              sleep_seconds=$((i*i*10))   # 10, 40, 90, 160, 250...
              echo "publish attempt $i failed, retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done

          echo "all $attempts publish attempts failed"
          exit 1

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "*.vsix"