name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install -g vsce

      - name: Package extension
        run: vsce package

      - name: List files
        run: ls -R

      - name: Check Marketplace connectivity
        run: |
          echo "testing endpoint..."
          curl -fsS https://marketplace.visualstudio.com/_apis/gallery || true

      - name: Publish to VS Code Marketplace
        run: |
          # `vsce` doesn’t support a debug option, but we can
          # increase verbosity with the npm log level environment
          # variable.  If you have network problems, the curl step
          # above will still help diagnose connectivity issues.
          npm_config_loglevel=verbose vsce publish -p ${{ secrets.VSCE_PAT }}

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "*.vsix"
